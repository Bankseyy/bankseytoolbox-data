name: Update Premier League standings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate ESPN standings
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --location \
            "https://site.web.api.espn.com/apis/v2/sports/soccer/eng.1/standings" \
            --output pl-standings.next.json
          test "$(jq '.children[0].standings.entries | length' pl-standings.next.json)" = "20"
          mv pl-standings.next.json pl-standings.json
      - name: Commit changed standings
        shell: bash
        run: |
          if git diff --quiet -- pl-standings.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl-standings.json
          git commit -m "Update Premier League standings"
          git push